name: CI hello
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  CI:
    name: Publish hello app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Call Dagger Function to build and publish to ghcr.io
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          workdir: hello
          verb: call
          args: publish --source=. 
